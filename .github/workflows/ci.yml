name: ALICE DataShield CI
on:
  # `ci/**` runs the same checks on a branch before it is fast-forwarded onto main
  push: { branches: [main, 'ci/**'] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-engine, api-gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}
      - run: cd services/${{ matrix.service }} && cargo check
      - run: cd services/${{ matrix.service }} && cargo clippy -- -D warnings
  # the library crate at the repository root (differential_privacy and the
  # integration tests); the job above builds only the services
  root-crate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (fails when no test ran)
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee test.log
          python3 -c "import re,sys; t=sum(int(m) for m in re.findall(r'test result: \w+\. (\d+) passed', open('test.log', encoding='utf-8', errors='replace').read())); print('tests passed in total:', t); sys.exit(0 if t > 0 else 1)"

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # ⚠️ `cd frontend && npm ci || npm install` は SC2015 (A && B || C は
      #    if-then-else ではない) ⇒ cd が失敗した時にも npm install が走り、
      #    repo 直下で install してしまう working-directory で cd を分離する
      - run: npm ci || npm install
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
