[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
# repo 直下と同じ二重 license (条文は ../../LICENSE-AGPL /
# ../../LICENSE-COMMERCIAL.md) ⚠️ 直下だけ変えると SPDX が repo 内で 2 種類に
# なり、条文 file の無い宣言が残って GitHub / SBOM が NOASSERTION になる
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
# proprietary: crates.io へ出さない (LICENSE 参照)
publish = false
[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
dashmap = "6"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
