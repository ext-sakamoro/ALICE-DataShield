[package]
name = "alice-datashield"
version = "0.2.0"
edition = "2021"
description = "Data masking, anonymization, and differential privacy"
license = "LicenseRef-Proprietary"
# crates.io へは出さない — library でなく service
publish = false

[dependencies]
# 差分プライバシーの noise 源 — ChaCha20 CSPRNG / Laplace の逆関数法 / bit 一致の ln
# ⚠️ 2026-10-09 まで本 crate が自前で持っていたが、同じ法則が ALICE-Crypto 側にもあり
#    写しが 2 つあると片方だけ直る 現に noise 生成は 3 箇所に独立に存在し、
#    本 crate だけが直った状態になっていた ⇒ 暗号 primitive の持ち主に寄せた
alice-crypto = { version = "0.4", default-features = false, features = ["std"] }
